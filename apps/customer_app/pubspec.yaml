name: customer_app
description: "Unique Basket - Customer Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Networking
  dio: ^5.4.3+1
  
  # Storage & Persistence
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  
  # Routing
  go_router: ^14.1.4
  
  # Utilities & Helpers
  intl: ^0.19.0
  equatable: ^2.0.5
  uuid: ^4.4.0
  
  # UI & Typography
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
